<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b1220" />
    <title>Digital Passport Platform</title>
    <script>
      /* theme before first paint (no flash): stored choice, otherwise dark (primary presentation) */
      try { var t = localStorage.getItem("dp-theme"); document.documentElement.dataset.theme = t === "light" ? "light" : "dark"; }
      catch (e) { document.documentElement.dataset.theme = "dark"; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
