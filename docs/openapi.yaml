components:
  schemas:
    AcceptRequest:
      type: object
      properties:
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
    AcceptanceRow:
      type: object
      description: One row of the mechanical acceptance table (tensile, yield, elongation,
        hardness, ...).
      properties:
        property:
          $ref: '#/components/schemas/PropertyEnum'
        requirement:
          type: string
          maxLength: 120
        unit:
          type: string
          maxLength: 30
        standard:
          type: string
          maxLength: 120
        frequency:
          type: string
          maxLength: 120
      required:
      - property
    AcceptanceRowRequest:
      type: object
      description: One row of the mechanical acceptance table (tensile, yield, elongation,
        hardness, ...).
      properties:
        property:
          $ref: '#/components/schemas/PropertyEnum'
        requirement:
          type: string
          maxLength: 120
        unit:
          type: string
          maxLength: 30
        standard:
          type: string
          maxLength: 120
        frequency:
          type: string
          maxLength: 120
      required:
      - property
    AdminImportDiscardRequest:
      type: object
      properties:
        client:
          type: string
          format: uuid
        import:
          type: string
          format: uuid
      required:
      - client
      - import
    AdminInventory:
      type: object
      properties:
        count:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
        results:
          type: array
          items:
            type: object
            additionalProperties: {}
        totals:
          type: object
          additionalProperties:
            type: integer
        clients:
          type: array
          items:
            type: object
            additionalProperties: {}
        all_clients:
          type: array
          items:
            type: object
            additionalProperties: {}
        projects:
          type: array
          items:
            type: object
            additionalProperties: {}
        detail_access:
          type: object
          additionalProperties: {}
      required:
      - all_clients
      - clients
      - count
      - detail_access
      - page
      - page_size
      - projects
      - results
      - totals
    AdminThumbnailConsent:
      type: object
      properties:
        allowed:
          type: boolean
        terms:
          type: string
        terms_version:
          type: string
        history:
          type: array
          items:
            type: object
            additionalProperties: {}
      required:
      - allowed
      - history
      - terms
      - terms_version
    AdminThumbnailDecisionRequest:
      type: object
      properties:
        allow:
          type: boolean
        confirm_terms_version:
          type: string
          minLength: 1
        note:
          type: string
      required:
      - allow
    AssessmentRequestRequestReasonEnum:
      enum:
      - assessment
      - reassessment
      - new_information
      type: string
      description: |-
        * `assessment` - assessment
        * `reassessment` - reassessment
        * `new_information` - new_information
    AssessmentRequestRequestRequest:
      type: object
      properties:
        reason:
          $ref: '#/components/schemas/AssessmentRequestRequestReasonEnum'
        remarks:
          type: string
      required:
      - reason
    AssessmentRunRequestRequest:
      type: object
      properties:
        ai_tier:
          type: string
        idempotency_key:
          type: string
        fault_injection:
          type: object
          additionalProperties: {}
          description: Test environments only
    AssessmentScheduleRequestRequest:
      type: object
      properties:
        enabled:
          type: boolean
        months:
          type: array
          items:
            type: integer
        day_of_month:
          type: integer
        ai_tier:
          type: string
      required:
      - day_of_month
      - enabled
      - months
    Attachment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        original_filename:
          type: string
          maxLength: 255
        kind:
          type: string
          maxLength: 8
        detected_format:
          type: string
          maxLength: 60
        content_type:
          type: string
          maxLength: 80
        size_bytes:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        sha256:
          type: string
          maxLength: 64
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - content_type
      - created_at
      - detected_format
      - id
      - kind
      - original_filename
      - sha256
      - size_bytes
    AuditEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        actor_email:
          type: string
          maxLength: 254
        actor_role:
          type: string
          maxLength: 32
        action:
          type: string
          maxLength: 80
        object_type:
          type: string
          maxLength: 60
        object_id:
          type: string
          maxLength: 64
        request_id:
          type: string
          maxLength: 64
        data: {}
      required:
      - action
      - created_at
      - id
    AuthorSideEnum:
      enum:
      - client
      - operator
      type: string
      description: |-
        * `client` - Client
        * `operator` - Operator
    BlankEnum:
      enum:
      - ''
    Change:
      type: object
      properties:
        field:
          type: string
        label:
          type: string
        original:
          nullable: true
        proposed:
          nullable: true
        current:
          nullable: true
          description: Value in the target now
        drifted:
          type: boolean
          description: The target value changed since the request was made
      required:
      - current
      - drifted
      - field
      - label
      - original
      - proposed
    Client:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 200
        slug:
          type: string
          readOnly: true
          description: Short identifier used at sign-in; set at creation and not changed
            afterwards.
          pattern: ^[-a-zA-Z0-9_]+$
        status:
          $ref: '#/components/schemas/ClientStatusEnum'
        hosting_model:
          $ref: '#/components/schemas/HostingModelEnum'
        region_code:
          type: string
          description: Informational only; region and residency rules are open (OQ-71).
          maxLength: 40
        member_count:
          type: integer
          readOnly: true
        profile_complete:
          type: boolean
          readOnly: true
          description: All required company-profile fields are filled in.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - member_count
      - name
      - profile_complete
      - slug
      - updated_at
    ClientCreateRequest:
      type: object
      description: |-
        Aries Admin creation of a client organisation: the same company profile as self-registration, plus the
        Aries-controlled short identifier and hosting configuration.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        trade_licence_number:
          type: string
          minLength: 1
          maxLength: 80
        licence_authority:
          type: string
          minLength: 1
          maxLength: 120
        country:
          type: string
          minLength: 1
          maxLength: 80
        state:
          type: string
          minLength: 1
          maxLength: 80
        city:
          type: string
          maxLength: 120
        address:
          type: string
          minLength: 1
          maxLength: 300
        contact_name:
          type: string
          minLength: 1
          maxLength: 150
        contact_title:
          type: string
          minLength: 1
          maxLength: 120
        contact_email:
          type: string
          format: email
          minLength: 1
        contact_phone:
          type: string
          minLength: 1
          maxLength: 40
          pattern: ^\+?[0-9 ()\-]{7,30}$
        slug:
          type: string
          minLength: 1
          maxLength: 60
          pattern: ^[a-z0-9][a-z0-9-]{1,58}[a-z0-9]$
        hosting_model:
          allOf:
          - $ref: '#/components/schemas/HostingModelEnum'
          default: shared
        region_code:
          type: string
          maxLength: 40
        invite_contact:
          type: boolean
          default: true
          description: Email the primary contact an invitation to become Client Administrator.
            The contact is not active or verified until they accept the emailed link.
      required:
      - address
      - contact_email
      - contact_name
      - contact_phone
      - contact_title
      - country
      - licence_authority
      - name
