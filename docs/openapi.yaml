  /api/v1/parts/stage-counts/:
    get:
      operationId: v1_parts_stage_counts_retrieve
      description: Counts per inventory stage for the caller's authorised records,
        with the same search and filters as the list.
      parameters:
      - in: query
        name: category
        schema:
          type: string
      - in: query
        name: criticality
        schema:
          type: string
      - in: query
        name: data_level
        schema:
          type: string
        description: 'Data captured at least to: rl1, rl2, rl3; or none (guidance
          only)'
      - in: query
        name: eligibility
        schema:
          type: string
        description: 'Manufacturing eligibility: not_eligible (includes parts without
          a passport), eligible_subject_to_authorisation, eligible, suspended (MOB-010;
          read-only state, OQ-36)'
      - in: query
        name: evidence_level
        schema:
          type: string
        description: 'Official evidence level: none, R-L1, R-L2, R-L3 (transitions
          gated, OQ-35)'
      - in: query
        name: has_3d
        schema:
          type: boolean
      - in: query
        name: has_passport
        schema:
          type: boolean
      - in: query
        name: ordering
        schema:
          type: string
          enum:
          - -created
          - -last_activity
          - -name
          - -part_number
          - created
          - last_activity
          - name
          - part_number
        description: Default -last_activity
      - in: query
        name: origin
        schema:
          type: string
          enum:
          - aries
          - client
      - in: query
        name: project
        schema:
          type: string
        description: Project id
      - in: query
        name: review_state
        schema:
          type: string
        description: not_required, pending_review, info_requested, accepted, declined;
          'open' = pending_review or info_requested
      - in: query
        name: search
        schema:
          type: string
        description: Part number, name, description or passport number
      - in: query
        name: source_part
        schema:
          type: string
        description: Clones of this part
      - in: query
        name: status
        schema:
          type: string
      tags:
      - v1
      security:
      - tenantBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StageCounts'
          description: ''
