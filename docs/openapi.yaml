          allOf:
          - $ref: '#/components/schemas/Completeness'
          readOnly: true
        notes_restricted:
          type: boolean
          readOnly: true
          description: True when this revision holds engineering notes that your role
            may not read; they are omitted from content.
        engineering_review_pending:
          type: boolean
          readOnly: true
          description: True when engineering notes are recorded for this revision.
            No engineer verification or resolution status is stored, so the review
            is reported as pending. The notes themselves are never assessed.
