openapi: 3.0.3
info:
  title: Digital Passport Platform API
  version: 1.0.0
  description: Versioned REST API (v1). All business endpoints are tenant-scoped;
    see docs/api.md.
paths:
  /api/health/:
    get:
      operationId: health_retrieve
      description: Liveness and database connectivity check (no tenant data).
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/admin/ai-management/:
    get:
      operationId: v1_admin_ai_management_retrieve
      tags:
      - v1
      security:
      - tenantBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/admin/ai-management/clients/{id}/:
    put:
      operationId: v1_admin_ai_management_clients_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientWorkspaceRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ClientWorkspaceRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ClientWorkspaceRequestRequest'
        required: true
      security:
      - tenantBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/admin/assessment-summary/:
    get:
      operationId: v1_admin_assessment_summary_retrieve
      tags:
      - v1
      security:
      - tenantBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/admin/clients/{client_id}/thumbnail-contract/:
    get:
      operationId: v1_admin_clients_thumbnail_contract_retrieve
      description: 'Aries organisation: a client company''s contract authorization
        for thumbnails of Aries scanning photos.'
      parameters:
      - in: path
        name: client_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - tenantBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
    post:
      operationId: v1_admin_clients_thumbnail_contract_create
      description: 'Aries organisation: a client company''s contract authorization
        for thumbnails of Aries scanning photos.'
      parameters:
      - in: path
        name: client_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: {}
          multipart/form-data:
            schema:
              type: object
              additionalProperties: {}
      security:
      - tenantBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/admin/clients/{client_id}/thumbnail-contract/{auth_id}/events/:
    post:
      operationId: v1_admin_clients_thumbnail_contract_events_create
      description: |-
        Verify, reject or end an authorization, or document the review of a client objection (each action checks its own
        right: verification, or the separately configured objection-review authority).
      parameters:
      - in: path
        name: auth_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: client_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: {}
          multipart/form-data:
            schema:
              type: object
              additionalProperties: {}
      security:
      - tenantBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/admin/intelligence-usage/:
    get:
      operationId: v1_admin_intelligence_usage_retrieve
      tags:
      - v1
      security:
      - tenantBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/admin/inventory/:
    get:
      operationId: v1_admin_inventory_retrieve
      parameters:
      - in: query
        name: client
        schema:
          type: string
      - in: query
        name: page
        schema:
          type: integer
      - in: query
        name: page_size
        schema:
          type: integer
      - in: query
        name: project
        schema:
          type: string
      - in: query
        name: publication
        schema:
          type: string
          enum:
          - not_published
          - published
      - in: query
        name: review_state
        schema:
          type: string
        description: open, pending_review, info_requested, accepted, declined, not_required
      - in: query
        name: search
        schema:
          type: string
      - in: query
        name: stage
        schema:
          type: string
          enum:
          - declined
          - in_digitisation
          - published
          - review
      tags:
      - v1
      security:
      - tenantBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminInventory'
          description: ''
  /api/v1/admin/inventory-imports/:
    get:
      operationId: v1_admin_inventory_imports_retrieve
      description: 'Aries Admin: import summaries per client company (no row contents,
        no part data), and discarding open previews.'
      parameters:
      - in: query
        name: client
        schema:
          type: string
      tags:
      - v1
      security:
      - tenantBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
    post:
      operationId: v1_admin_inventory_imports_create
      description: 'Aries Admin: import summaries per client company (no row contents,
        no part data), and discarding open previews.'
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminImportDiscardRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminImportDiscardRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminImportDiscardRequest'
        required: true
      security:
      - tenantBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/admin/inventory/thumbnails/{token}/:
    get:
      operationId: v1_admin_inventory_thumbnails_retrieve
      description: One sanitized thumbnail for the Aries Admin inventory grid, by
        a token issued with the administrative summary.
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - tenantBearer: []
      responses:
        '200':
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
          description: ''
  /api/v1/admin/platform-settings/:
    get:
      operationId: v1_admin_platform_settings_retrieve
      tags:
      - v1
      security:
      - tenantBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/admin/thumbnail-contracts/:
    get:
      operationId: v1_admin_thumbnail_contracts_retrieve
      description: 'Aries organisation: contract-route status of every client company,
        with the actions waiting for this user.'
      tags:
      - v1
      security:
      - tenantBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/audit-events/:
    get:
      operationId: v1_audit_events_list
      description: Read-only, tenant-scoped audit trail.
      parameters:
      - in: query
        name: action
        schema:
          type: string
      - in: query
        name: client
        schema:
          type: string
        description: Only events about this client company (id).
      - in: query
        name: exclude_views
        schema:
          type: boolean
        description: Leave out record-view events (actions ending in _viewed).
      - in: query
        name: object_id
        schema:
          type: string
      - in: query
        name: object_type
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - v1
      security:
      - tenantBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditEventList'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: v1_auth_logout_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutInRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutInRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutInRequest'
        required: true
      security:
      - tenantBearer: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/me/:
    get:
      operationId: v1_auth_me_retrieve
      tags:
      - auth
      security:
      - tenantBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/auth/memberships/:
    get:
      operationId: v1_auth_memberships_list
      description: |-
        The caller's own active memberships (organisation switcher and operator overview, UX-1).

        Counts are read inside each tenant's own context (row-level security applies); only organisations the user
        already belongs to are listed. No new access is granted here.
      tags:
      - auth
      security:
      - tenantBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MembershipSummary'
          description: ''
  /api/v1/auth/refresh/:
    post:
      operationId: v1_auth_refresh_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshInRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefreshInRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshInRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshOut'
          description: ''
  /api/v1/auth/switch/:
    post:
      operationId: v1_auth_switch_create
      description: |-
        Switch the session to another organisation the user already belongs to (no password re-entry).

        Issues tokens for that membership and revokes the presented refresh token. Audited in both organisations.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwitchInRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SwitchInRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SwitchInRequest'
        required: true
      security:
      - tenantBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SwitchOut'
          description: ''
  /api/v1/auth/token/:
    post:
      operationId: v1_auth_token_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
  /api/v1/client-intelligence/:
    get:
      operationId: v1_client_intelligence_retrieve
      tags:
      - v1
      security:
      - tenantBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/client-intelligence/dashboard/:
    get:
      operationId: v1_client_intelligence_dashboard_retrieve
      tags:
      - v1
      security:
      - tenantBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/client-intelligence/members/:
    get:
      operationId: v1_client_intelligence_members_retrieve
      tags:
      - v1
      security:
      - tenantBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
    put:
      operationId: v1_client_intelligence_members_update
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceMemberRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WorkspaceMemberRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WorkspaceMemberRequestRequest'
        required: true
      security:
      - tenantBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/client-intelligence/parts/{id}/:
    get:
      operationId: v1_client_intelligence_parts_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - tenantBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/client-intelligence/parts/{id}/report.pdf:
    get:
      operationId: v1_client_intelligence_parts_report.pdf_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - tenantBearer: []
      responses:
        '200':
          content:
            application/pdf:
              schema:
                type: string
                format: binary
          description: ''
  /api/v1/client-intelligence/parts/{id}/request/:
    post:
      operationId: v1_client_intelligence_parts_request_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssessmentRequestRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AssessmentRequestRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssessmentRequestRequestRequest'
        required: true
      security:
      - tenantBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/clients/:
    get:
      operationId: v1_clients_list
      description: Operator administrators manage client organisations (operator tenant
        only).
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - v1
      security:
      - tenantBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedClientList'
          description: ''
    post:
      operationId: v1_clients_create
      description: |-
        Create a client organisation directly (no registration approval step). The primary contact is invited, never
        activated or marked verified here.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ClientCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ClientCreateRequest'
        required: true
      security:
      - tenantBearer: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
          description: ''
  /api/v1/clients/{id}/:
    get:
      operationId: v1_clients_retrieve
      description: Operator administrators manage client organisations (operator tenant
        only).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this tenant.
        required: true
      tags:
      - v1
      security:
      - tenantBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
          description: ''
    put:
      operationId: v1_clients_update
      description: Operator administrators manage client organisations (operator tenant
        only).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this tenant.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ClientRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ClientRequest'
        required: true
      security:
      - tenantBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
          description: ''
    patch:
      operationId: v1_clients_partial_update
      description: Operator administrators manage client organisations (operator tenant
        only).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this tenant.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedClientRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedClientRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedClientRequest'
      security:
      - tenantBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
          description: ''
  /api/v1/clients/{id}/details/:
    get:
      operationId: v1_clients_details_retrieve
      description: |-
        Audited company overview for Aries Admins: registration record, people, Aries staff scopes and aggregate
        counts. Read inside the client's own tenant context; no part, passport or document content is returned.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this tenant.
        required: true
      tags:
      - v1
      security:
      - tenantBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/clients/{id}/engineers/{mid}/access/:
    get:
      operationId: v1_clients_engineers_access_retrieve
      description: |-
        Company-wide or project-limited access of one assigned Aries staff member (CN-002 D4). Audited in both
        organisations; the engineer is notified. Nobody can change their own access.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this tenant.
        required: true
      - in: path
        name: mid
        schema:
          type: string
          pattern: ^[0-9a-f-]+$
        required: true
      tags:
      - v1
      security:
      - tenantBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
    put:
      operationId: v1_clients_engineers_access_update
      description: |-
        Company-wide or project-limited access of one assigned Aries staff member (CN-002 D4). Audited in both
        organisations; the engineer is notified. Nobody can change their own access.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this tenant.
        required: true
      - in: path
        name: mid
        schema:
          type: string
          pattern: ^[0-9a-f-]+$
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EngineerAccessInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EngineerAccessInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EngineerAccessInputRequest'
        required: true
      security:
      - tenantBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/clients/{id}/members/:
    get:
      operationId: v1_clients_members_list
      description: Operator administrators manage client organisations (operator tenant
        only).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this tenant.
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - v1
      security:
      - tenantBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMemberList'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
          description: ''
    post:
      operationId: v1_clients_members_create
      description: Operator administrators manage client organisations (operator tenant
        only).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this tenant.
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberRequest'
